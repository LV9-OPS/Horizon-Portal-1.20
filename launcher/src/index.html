<!doctype html>
<html lang="en" data-theme="destiny1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Horizon Manager">
  <title>Horizon Manager</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js" defer></script>
</head>
<body>
  <header class="windowbar" data-tauri-drag-region>
    <div class="windowbar-brand" data-tauri-drag-region>
      <img src="./assets/logo.png" alt="" draggable="false">
      <span>HORIZON MANAGER</span>
    </div>
    <div class="windowbar-actions">
      <button class="window-control minimize" id="window-minimize" aria-label="Réduire">−</button>
      <button class="window-control maximize" id="window-maximize" aria-label="Agrandir">□</button>
      <button class="window-control close" id="window-close" aria-label="Fermer">×</button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="./assets/logo.png" alt="Horizon" class="brand-logo">
        <div><strong>HORIZON</strong><small>MANAGER</small></div>
      </div>

      <nav class="main-nav" aria-label="Navigation">
        <button class="nav-item active" data-route="home"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z"/></svg></span><span class="nav-label">Home</span></button>
        <button class="nav-item" data-route="workshop"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/><circle cx="12" cy="12" r="3.2"/></svg></span><span class="nav-label">Workshop</span></button>
        <button class="nav-item" data-route="library"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4.5h14v15H5zM8 8h8M8 12h8M8 16h5"/></svg></span><span class="nav-label">Library</span></button>
        <button class="nav-item" data-route="downloads"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v11M8 10l4 4 4-4M5 20h14"/></svg></span><span class="nav-label">Downloads</span></button>
        <button class="nav-item" data-route="tools"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m14.5 5.5 4 4M13 7l-6.5 6.5a2.1 2.1 0 0 0 3 3L16 10M15.5 3.5a5 5 0 0 0 5 5l-3 3"/><path d="m5 19 3-3"/></svg></span><span class="nav-label">Tools</span></button>
        <button class="nav-item" data-route="themes"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/></svg></span><span class="nav-label">Themes</span></button>
        <button class="nav-item" data-route="settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="m12 2 1 2.2 2 .8 2.2-1 1.8 1.8-1 2.2.8 2L21 11v2l-2.2 1-.8 2 1 2.2-1.8 1.8-2.2-1-2 .8-1 2.2h-2l-1-2.2-2-.8-2.2 1L4 18.2l1-2.2-.8-2L2 13v-2l2.2-1 .8-2L4 5.8 5.8 4l2.2 1 2-.8L11 2z"/></svg></span><span class="nav-label">Settings</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="status-card">
          <span class="status-dot"></span>
          <div><strong>Horizon Online</strong><small>Manager 1.0.0</small></div>
        </div>
        <button class="profile-mini" data-route="account" id="sidebar-profile">
          <span class="avatar" id="sidebar-avatar">G</span>
          <div><strong id="sidebar-username">Guest</strong><small id="sidebar-account-status">Horizon Account</small></div>
        </button>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <span class="eyebrow" id="eyebrow">HORIZON MANAGER</span>
          <h1 id="page-title">Home</h1>
        </div>
        <div class="top-actions">
          <label class="search-box hidden" id="search-wrap">
            <span>⌕</span>
            <input id="library-search" type="search" placeholder="Search Library..." autocomplete="off">
          </label>
          <button class="creator-top-nav" data-route="creator" id="creator-top-nav" hidden>Creator</button>
          <button class="top-link" id="update-check-button" type="button">Check for updates</button>
          <button class="profile-button" data-route="account" id="top-profile">
            <span class="avatar" id="top-avatar">G</span>
            <div><strong id="top-username">Guest</strong><small id="top-account-status">Local Profile</small></div>
          </button>
        </div>
      </header>

      <main id="page"></main>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <div class="username-setup" id="username-setup" aria-hidden="true">
    <div class="username-setup-backdrop"></div>
    <section class="username-setup-card" role="dialog" aria-modal="true" aria-labelledby="username-setup-title">
      <span class="username-setup-stars" aria-hidden="true"></span>
      <div class="username-setup-mark">
        <img src="./assets/logo.png" alt="" draggable="false">
      </div>
      <span class="section-label">HORIZON PORTAL // INITIAL SETUP</span>
      <h2 id="username-setup-title">Welcome to Horizon</h2>
      <p>Choose the name that will be displayed on your Horizon Manager profile.</p>
      <label for="username-setup-input">Display name</label>
      <input id="username-setup-input" type="text" maxlength="24" minlength="2" autocomplete="nickname" placeholder="Your username">
      <small class="username-setup-hint">2 to 24 characters</small>
      <button class="button primary username-setup-submit" id="username-setup-submit" type="button">CONTINUE</button>
    </section>
  </div>
</body>
</html>
